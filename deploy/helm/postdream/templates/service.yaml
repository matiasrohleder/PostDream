apiVersion: v1
kind: Service
metadata:
  name: {{ include "postdream.fullname" . }}
  labels: {{- include "postdream.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "postdream.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.httpPort }}, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postdream.fullname" . }}-smtp
  labels: {{- include "postdream.labels" . | nindent 4 }}
  {{- with .Values.service.smtp.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.smtp.type }}
  selector: {{- include "postdream.selector" . | nindent 4 }}
  ports:
    - { name: smtp, port: {{ .Values.service.smtp.port }}, targetPort: smtp }
    {{- if .Values.env.POP3_ADDR }}
    - { name: pop3, port: {{ .Values.service.smtp.pop3Port }}, targetPort: pop3 }
    {{- end }}
