apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postdream.fullname" . }}
  labels: {{- include "postdream.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.database.existingSecret }}
  DATABASE_URL: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.admin.password (not .Values.admin.existingSecret) }}
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
